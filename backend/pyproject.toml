[project]
name = "digital-enterprise-sandbox-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlmodel>=0.0.21",
  "python-multipart>=0.0.9",
  "httpx[socks]>=0.27",
  "python-docx>=1.1",
  "pdfplumber>=0.11",
  "openpyxl>=3.1",
  "python-pptx>=0.6.23",
  "pillow>=10.4"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
