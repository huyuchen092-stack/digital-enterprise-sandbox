services:
  - type: web
    name: digital-enterprise-sandbox
    runtime: python
    plan: free
    buildCommand: cd frontend && npm ci && npm run build && cd ../backend && pip install .
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: Digital Enterprise Sandbox AI
      - key: DATABASE_URL
        value: sqlite:///./sandbox.db
      - key: UPLOAD_DIR
        value: ./uploads
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: DEEPSEEK_API_KEY
        sync: false
